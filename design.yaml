# Language codes used in content/ and targets/, each mapped to a RenderCV
# locale. The first one names the PDF files.
languages:
  en: english
  zh: mandarin_chinese

# RenderCV design shared by every language. Options: https://docs.rendercv.com
design:
  theme: classic
  page:
    size: a4
    show_footer: false
    show_top_note: false
  sections:
    show_time_spans_in: []

# Settings for one language, added on top of the shared design.
zh:
  typography:
    font_family: Noto Sans SC
  templates:
    single_date: YEAR年MONTH月
    experience_entry:
      main_column: "**COMPANY**，POSITION\nSUMMARY\nHIGHLIGHTS"
    education_entry:
      main_column: "**INSTITUTION**，AREA\nSUMMARY\nHIGHLIGHTS"
