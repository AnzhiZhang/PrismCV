# Language codes used in cv.yaml, content/ and targets/, each mapped to a
# RenderCV locale. The first one names the PDF files.
languages:
  en: english

# RenderCV design shared by every language. Options: https://docs.rendercv.com
design:
  theme: classic
  page:
    size: a4
    show_footer: false
    show_top_note: false
  sections:
    show_time_spans_in: []
