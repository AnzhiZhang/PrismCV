# PDF file names: {lang} becomes the language code and {target} the target's
# name. Without file_name, PDFs are named after the name in cv.yaml.
# file_name: Your_Name_CV_{lang}

# Language codes and their RenderCV locales.
languages:
  en: english

# RenderCV design shared by every language. Options: https://docs.rendercv.com
design:
  theme: classic
  page:
    size: a4
    show_footer: false
    show_top_note: false
  header:
    connections:
      phone_number_format: international
  sections:
    show_time_spans_in: []
