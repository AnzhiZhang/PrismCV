# Plain text is shared by all languages; {en: ..., zh: ...} gives one text per language.
header:
  name: { en: John Doe, zh: 约翰·多伊 }
  location: { en: "San Francisco, CA", zh: 美国旧金山 }
  email: john.doe@email.com
  website: https://rendercv.com/
  social_networks:
    - network: LinkedIn
      username: rendercv
    - network: GitHub
      username: rendercv

sections:
