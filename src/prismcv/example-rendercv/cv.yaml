  projects:     { en: Projects, zh: 项目经历 }
  publications: { en: Publications, zh: 发表论文 }
  honors:       { en: Selected Honors, zh: 主要荣誉 }
  patents:      { en: Patents, zh: 专利 }
  talks:        { en: Invited Talks, zh: 受邀报告 }
  skills:       { en: Skills, zh: 技能 }
